name: Deploy GitHub Pages

on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install tooling dependencies when present
        if: hashFiles('package-lock.json') != ''
        run: npm ci
      - name: Install frontend dependencies
        run: npm ci --prefix web
      - name: Validate catalog and build static assets
        run: npm run deploy:build
      - name: Build for project Pages
        run: npm run build --prefix web -- --mode github-pages
      - name: Validate production userscript and Pages assets
        run: node scripts/validate-production-assets.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
